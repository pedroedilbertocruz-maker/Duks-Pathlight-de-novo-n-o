<!doctype html>
<html><head><meta charset="utf-8"><title>PathLight GI harness</title></head>
<body>
<script type="module">
// Test harness: runs the mod's real WGSL passes against a synthetic Cornell-box G-buffer.
// window.runTest(opts) -> { images: {name: dataURL}, log: [...] }

const W = 512, H = 320;

// ---------- tiny mat4 / vec3 helpers (column-major) ----------
const v3 = {

function mat4mul(a, b) { // a * b, column-major

}

  inv[8] = a[4]*a[9]*a[15]-a[4]*a[11]*a[13]-a[8]*a[5]*a[15]+a[8]*a[7]*a[13]+a[12]*a[5]*a[11]-a[12]*a[7]*a[9];
  inv[12] = -a[4]*a[9]*a[14]+a[4]*a[10]*a[13]+a[8]*a[5]*a[14]-a[8]*a[6]*a[13]-a[12]*a[5]*a[10]+a[12]*a[6]*a[9];
  inv[1] = -a[1]*a[10]*a[15]+a[1]*a[11]*a[14]+a[9]*a[2]*a[15]-a[9]*a[3]*a[14]-a[13]*a[2]*a[11]+a[13]*a[3]*a[10];
  inv[5] = a[0]*a[10]*a[15]-a[0]*a[11]*a[14]-a[8]*a[2]*a[15]+a[8]*a[3]*a[14]+a[12]*a[2]*a[11]-a[12]*a[3]*a[10];
  inv[9] = -a[0]*a[9]*a[15]+a[0]*a[11]*a[13]+a[8]*a[1]*a[15]-a[8]*a[3]*a[13]-a[12]*a[1]*a[11]+a[12]*a[3]*a[9];
  inv[13] = a[0]*a[9]*a[14]-a[0]*a[10]*a[13]-a[8]*a[1]*a[14]+a[8]*a[2]*a[13]+a[12]*a[1]*a[10]-a[12]*a[2]*a[9];

  inv[6] = -a[0]*a[6]*a[15]+a[0]*a[7]*a[14]+a[4]*a[2]*a[15]-a[4]*a[3]*a[14]-a[12]*a[2]*a[7]+a[12]*a[3]*a[6];
  inv[10] = a[0]*a[5]*a[15]-a[0]*a[7]*a[13]-a[4]*a[1]*a[15]+a[4]*a[3]*a[13]+a[12]*a[1]*a[7]-a[12]*a[3]*a[5];
  inv[14] = -a[0]*a[5]*a[14]+a[0]*a[6]*a[13]+a[4]*a[1]*a[14]-a[4]*a[2]*a[13]-a[12]*a[1]*a[6]+a[12]*a[2]*a[5];
  inv[3] = -a[1]*a[6]*a[11]+a[1]*a[7]*a[10]+a[5]*a[2]*a[11]-a[5]*a[3]*a[10]-a[9]*a[2]*a[7]+a[9]*a[3]*a[6];
  inv[7] = a[0]*a[6]*a[11]-a[0]*a[7]*a[10]-a[4]*a[2]*a[11]+a[4]*a[3]*a[10]+a[8]*a[2]*a[7]-a[8]*a[3]*a[6];

// ---------- camera ----------
const NEAR = 10, FAR = 5000, FOVY = 60 * Math.PI / 180;
function makeCamera(eye, yaw) {
  const f = [Math.sin(yaw), -0.05, -Math.cos(yaw)];
  const fwd = v3.norm(f);
  const right = v3.norm(v3.cross(fwd, [0,1,0]));
  const up = v3.cross(right, fwd);
  const view = [
    right[0], up[0], -fwd[0], 0,
    right[1], up[1], -fwd[1], 0,
    right[2], up[2], -fwd[2], 0,
    -v3.dot(right, eye), -v3.dot(up, eye), v3.dot(fwd, eye), 1,
  ];
  const fl = 1 / Math.tan(FOVY / 2), aspect = W / H;
  const A = NEAR / (FAR - NEAR), B = NEAR * FAR / (FAR - NEAR);

  proj[0] = fl / aspect; proj[5] = fl; proj[10] = A; proj[11] = -1; proj[14] = B;
  const worldFromView = [right[0],right[1],right[2],0, up[0],up[1],up[2],0, -fwd[0],-fwd[1],-fwd[2],0, eye[0],eye[1],eye[2],1];
  return { eye, fwd, right, up, view, proj, invProj: mat4inv(proj), worldFromView, projFromWorld: mat4mul(proj, view), aspect, fl };

// ---------- synthetic scene ----------
const BOXES = [
  { min: [-110, 0, -330], max: [-30, 190, -250], albedo: [0.75, 0.75, 0.75] },
  { min: [30, 0, -250], max: [130, 100, -150], albedo: [0.65, 0.65, 0.7] },
];
const CAVE_BOXES = [
  { min: [-110, 0, -330], max: [-30, 300, -250], albedo: [0.62, 0.58, 0.52] },
  { min: [30, 0, -250], max: [130, 100, -150], albedo: [0.55, 0.52, 0.5] },
];
const LIGHT = [0, 288, -250];
const LAMP = { min: [-60, 299, -300], max: [60, 301, -200] };
const ROOM = { x0: -200, x1: 200, y0: 0, y1: 300, z0: -400 };
let OPEN = false;
const WALL_COL_CORNELL = { left: [0.85, 0.12, 0.1], right: [0.12, 0.7, 0.15], other: [0.78, 0.78, 0.78] };
const WALL_COL_CAVE = { left: [0.5, 0.45, 0.4], right: [0.45, 0.45, 0.5], other: [0.5, 0.47, 0.42] };
let WALL_COL = WALL_COL_CORNELL;

function rayBox(o, d, mn, mx) {
  let t0 = 0, t1 = Infinity, nAxis = -1, nSign = 0;
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-9) { if (o[a] < mn[a] || o[a] > mx[a]) return null; continue; }
    let ta = (mn[a]-o[a])/d[a], tb = (mx[a]-o[a])/d[a], sgn = -1;
    if (ta > tb) { [ta, tb] = [tb, ta]; sgn = 1; }
    if (ta > t0) { t0 = ta; nAxis = a; nSign = sgn; }
    if (tb < t1) t1 = tb;
    if (t0 > t1) return null;
  }
  if (nAxis < 0) return null;
  const n = [0,0,0]; n[nAxis] = nSign;
  return { t: t0, n };
}
function shadowed(p, n) {
  const o = v3.add(p, v3.mul(n, 0.8));

  for (const b of BOXES) { const h = rayBox(o, d, b.min, b.max); if (h && h.t < dist) return true; }
  return false;
}
let SCENE = 'cornell';
let TORCHES = [];
let FOG = null;  // { start, end, color:[r,g,b], k:[10] (already /64, pair-swapped), center }
function fogLut(xNdc) {
  const off = xNdc - FOG.center;
  const idx = Math.min(9, Math.max(0, 9 - Math.abs(off) * 9));

}
function fogFactor(xNdc, z) { return Math.min(1, Math.max(0, (z * fogLut(xNdc) - FOG.start) / Math.max(FOG.end - FOG.start, 1))); }
function torchAtt(d2, r) { const x = d2 / (r*r); if (x >= 1) return 0; const w = 1 - x, core = r * 0.22; return w*w*core*core/(d2+core*core); }
function shade(p, n, albedo) {
  if (SCENE === 'cave') {
    // What the original game would render: flat dim ambient + unshadowed per-light lighting.
    const lin = [0, 0, 0];
    for (const t of TORCHES) {
      const L = v3.sub(t.pos, p); const d2 = v3.dot(L, L); if (d2 >= t.radius * t.radius) continue;
      const ld = v3.mul(L, 1/Math.sqrt(d2)); const lam = Math.max(v3.dot(n, ld), 0);
      const a = torchAtt(d2, t.radius) * lam * 0.9;

function renderGBuffer(cam) {

    const nx = ((x+0.5)/W)*2-1, ny = 1-((y+0.5)/H)*2;
    const dir = v3.norm(v3.add(v3.add(v3.mul(cam.fwd, 1), v3.mul(cam.right, nx * cam.aspect / cam.fl)), v3.mul(cam.up, ny / cam.fl)));
    let best = null;
    const consider = (t, n, albedo, emissive) => { if (OPEN && n[1] === 0 && cam.eye[1] + t * dir[1] > 300 && albedo !== BOXES[0].albedo && albedo !== BOXES[1].albedo) return; if (t > 0 && (!best || t < best.t)) best = { t, n, albedo, emissive }; };
    // room planes
    if (dir[1] < 0) consider((ROOM.y0 - cam.eye[1]) / dir[1], [0,1,0], WALL_COL.other);
    if (dir[1] > 0 && !OPEN) consider((ROOM.y1 - cam.eye[1]) / dir[1], [0,-1,0], WALL_COL.other);
    if (dir[0] < 0) consider((ROOM.x0 - cam.eye[0]) / dir[0], [1,0,0], WALL_COL.left);
    if (dir[0] > 0) consider((ROOM.x1 - cam.eye[0]) / dir[0], [-1,0,0], WALL_COL.right);
    if (dir[2] < 0) consider((ROOM.z0 - cam.eye[2]) / dir[2], [0,0,1], WALL_COL.other);
    for (const b of BOXES) { const h = rayBox(cam.eye, dir, b.min, b.max); if (h) consider(h.t, h.n, b.albedo); }
    const lamp = SCENE === 'cave' ? null : rayBox(cam.eye, dir, LAMP.min, LAMP.max); if (lamp && (!best || lamp.t < best.t)) consider(lamp.t, lamp.n, [1,1,0.9], true);

    if (!best) { // sky
      depth[i] = 0; normal[i*4+3] = 0;
      const g = Math.min(1, Math.max(0, dir[1] * 1.5 + 0.35));
      color[i*4] = Math.round((0.55 + 0.1*g)*255); color[i*4+1] = Math.round((0.7+0.1*g)*255); color[i*4+2] = 255; color[i*4+3] = 255;
      continue;
    }

    const rel = v3.sub(p, cam.eye);
    const zv = -v3.dot(rel, cam.fwd);
    const A = NEAR / (FAR - NEAR), B = NEAR * FAR / (FAR - NEAR);
    depth[i] = (A * zv + B) / -zv;
    const nv = [v3.dot(best.n, cam.right), v3.dot(best.n, cam.up), -v3.dot(best.n, cam.fwd)];
    normal[i*4] = Math.round((nv[0]*0.5+0.5)*255); normal[i*4+1] = Math.round((nv[1]*0.5+0.5)*255);
    normal[i*4+2] = Math.round((nv[2]*0.5+0.5)*255); normal[i*4+3] = 255;
    let c = best.emissive ? best.albedo : shade(p, best.n, best.albedo);
    if (FOG) { const f = fogFactor(nx, -zv); c = c.map((v, k) => v * (1 - f) + FOG.color[k] * f); }
    color[i*4] = Math.round(c[0]*255); color[i*4+1] = Math.round(c[1]*255); color[i*4+2] = Math.round(c[2]*255); color[i*4+3] = 255;

  return { depth, normal, color };
}

// ---------- WebGPU ----------
async function fetchText(u) { return (await fetch(u)).text(); }

window.runTest = async function (opts) {
  const log = []; OPEN = !!opts.open;
  SCENE = opts.scene || 'cornell'; TORCHES = opts.torches || [];
  FOG = null;
  if (opts.fog) { const r = opts.fog.range === false ? null : (opts.fog.table || [260, 260, 270, 280, 290, 300, 310, 320, 330, 340]);
    FOG = { start: opts.fog.start, end: opts.fog.end, color: opts.fog.color, center: opts.fog.center || 0,
            k: r ? Array.from({ length: 10 }, (_, i) => r[i ^ 1] / 64) : new Array(10).fill(1e6) }; }
  if (SCENE === 'cave') { WALL_COL = WALL_COL_CAVE; BOXES.splice(0, BOXES.length, ...CAVE_BOXES); OPEN = false; } else { WALL_COL = WALL_COL_CORNELL; }
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const errors = [];
  device.addEventListener('uncapturederror', e => errors.push(e.error.message));

  const common = await fetchText('/res/common.wgsl');
  const mk = async (name, entry) => {
    const code = common + '\n' + await fetchText('/res/' + name);
    const module = device.createShaderModule({ code, label: name });
    const info = await module.getCompilationInfo();
    for (const m of info.messages) log.push(`[${name}] ${m.type}: ${m.message} (line ${m.lineNum - common.split('\n').length - 1})`);
    return module;
  };
  const traceM = await mk('trace.wgsl'), temporalM = await mk('temporal.wgsl'), denoiseM = await mk('denoise.wgsl'), compM = await mk('composite.wgsl');
  const cp = (module, entryPoint) => device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint } });
  const tracePipe = cp(traceM, 'trace'), temporalPipe = cp(temporalM, 'temporal'), denoisePipe = cp(denoiseM, 'denoise');
  const mkComp = (blend) => device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: compM, entryPoint: 'vs_main' },
    fragment: { module: compM, entryPoint: 'fs_main', targets: [{ format: 'rgba8unorm',
      blend: blend ? { color: { operation: 'add', srcFactor: 'one', dstFactor: 'one-minus-src-alpha' }, alpha: { operation: 'add', srcFactor: 'zero', dstFactor: 'one' } } : undefined }] },
    primitive: { topology: 'triangle-list' },
  });
  const compPipe = mkComp(true), compDebugPipe = mkComp(false);

  const half = opts.halfRes ? 2 : 1;
  const GW = Math.floor(W / half), GH = Math.floor(H / half);
  const T = (w, h, format, usage) => device.createTexture({ size: [w, h], format, usage });
  const SB = GPUTextureUsage.TEXTURE_BINDING, ST = GPUTextureUsage.STORAGE_BINDING, CD = GPUTextureUsage.COPY_DST, CS = GPUTextureUsage.COPY_SRC, RA = GPUTextureUsage.RENDER_ATTACHMENT;
  const depthT = T(W, H, 'r32float', SB | CD), normalT = T(W, H, 'rgba8unorm', SB | CD), colorT = T(W, H, 'rgba8unorm', SB | CD | CS);
  const target = T(W, H, 'rgba8unorm', RA | CS | CD);
  const gi = () => T(GW, GH, 'rgba16float', SB | ST), meta = () => T(GW, GH, 'rg32float', SB | ST);
  const raw = gi(), accum = [gi(), gi()], metas = [meta(), meta()], tmpA = gi(), tmpB = gi(), final = gi();
  const view = t => t.createView();

  const UB = 1504;
  function packUniforms(cam, prevCam, frame, step, histValid) {
    const buf = new ArrayBuffer(UB), f = new Float32Array(buf), ui = new Uint32Array(buf);
    f.set(cam.proj, 0); f.set(cam.invProj, 16); f.set(cam.worldFromView, 32); f.set(prevCam ? prevCam.projFromWorld : cam.projFromWorld, 48);
    f.set([GW, GH, 1/GW, 1/GH], 64); f.set([W, H, half, half], 68);
    f.set([opts.rayLength, opts.thickness, opts.intensity, opts.bounce], 72);
    f.set([opts.aoRadius, opts.aoStrength, opts.sky, opts.emissive], 76);
    f.set([opts.bleed, opts.historyFrames, opts.clampK, opts.denoise], 80);
    f.set([NEAR, histValid ? 1 : 0, step, 0], 84);
    ui.set([frame, opts.rays, opts.steps, opts.debug || 0], 88);
    const dk = opts.dark || { scale: 1, gain: 1, shadow: 1, steps: 0, restore: 0.7 };
    const lights = (opts.scene === 'cave' ? opts.lightList : []) || [];
    f.set([dk.scale, dk.gain, dk.shadow, dk.steps], 92);
    f.set([lights.length, dk.restore, 0, frame * 0.033], 96);
    const fogStrength = opts.fogStrength === undefined ? 1 : opts.fogStrength;
    f.set(FOG ? [FOG.start, FOG.end, 1, FOG.center] : [0, 1, 0, 0], 100);
    f.set(FOG ? [FOG.color[0], FOG.color[1], FOG.color[2], fogStrength] : [0, 0, 0, 0], 104);
    if (FOG) f.set(FOG.k, 108);
    lights.forEach((l, k) => {
      const vp = [0, 1, 2].map(r => cam.view[r] * l.pos[0] + cam.view[4 + r] * l.pos[1] + cam.view[8 + r] * l.pos[2] + cam.view[12 + r]);
      f.set([vp[0], vp[1], vp[2], l.radius], 120 + 8 * k);
      f.set([l.color[0], l.color[1], l.color[2], l.kind || 0], 132 + 8 * k);

  const images = {};

    const bpr = W * 4, buf = device.createBuffer({ size: bpr * H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

    await buf.mapAsync(GPUMapMode.READ); const data = new Uint8ClampedArray(buf.getMappedRange().slice(0)); buf.unmap();

    return { url: cv.toDataURL('image/png'), data };
  }

  const frames = opts.frames, captures = new Set(opts.capture);
  let prevCam = null, cur = 0;
  const stats = {};
  for (let fi = 0; fi < frames; fi++) {
    const yaw = opts.orbit ? Math.sin(fi * 0.15) * 0.06 : 0;
    const eye = [opts.orbit ? Math.sin(fi * 0.15) * 15 : 0, 150, 160];
    const cam = makeCamera(eye, yaw);
    if (fi === 0 || opts.orbit || !opts.cache) { opts.cache = renderGBuffer(cam); }
    const gb = opts.cache;
    device.queue.writeTexture({ texture: depthT }, gb.depth, { bytesPerRow: W*4 }, [W, H]);
    device.queue.writeTexture({ texture: normalT }, gb.normal, { bytesPerRow: W*4 }, [W, H]);
    device.queue.writeTexture({ texture: colorT }, gb.color, { bytesPerRow: W*4 }, [W, H]);

    const prev = 1 - cur;
    const ub = mkUB(packUniforms(cam, prevCam, fi % 4096, 0, fi > 0));
    const ubs = [1, 2, 4].map(s => mkUB(packUniforms(cam, prevCam, fi % 4096, s, fi > 0)));
    const ubDebug = (dbg) => mkUB((() => { const o = { ...opts, debug: dbg }; const save = opts.debug; opts.debug = dbg; const b = packUniforms(cam, prevCam, fi % 4096, 0, fi > 0); opts.debug = save; return b; })());

    const enc = device.createCommandEncoder();
    // render target starts as the opaque scene colour
    enc.copyTextureToTexture({ texture: colorT }, { texture: target }, [W, H]);
    const pass = enc.beginComputePass();
    const dispatch = (pipe, bind) => { pass.setPipeline(pipe); pass.setBindGroup(0, bind); pass.dispatchWorkgroups(Math.ceil(GW / 8), Math.ceil(GH / 8)); };
    dispatch(tracePipe, bg(tracePipe, [[0, ub], [1, depthT], [2, normalT], [3, colorT], [4, final], [5, raw]]));
    dispatch(temporalPipe, bg(temporalPipe, [[0, ub], [1, depthT], [2, normalT], [4, raw], [5, accum[prev]], [6, metas[prev]], [7, accum[cur]], [8, metas[cur]]]));
    dispatch(denoisePipe, bg(denoisePipe, [[0, ubs[0]], [1, depthT], [2, normalT], [4, accum[cur]], [6, metas[cur]], [7, tmpA]]));
    dispatch(denoisePipe, bg(denoisePipe, [[0, ubs[1]], [1, depthT], [2, normalT], [4, tmpA], [6, metas[cur]], [7, tmpB]]));
    dispatch(denoisePipe, bg(denoisePipe, [[0, ubs[2]], [1, depthT], [2, normalT], [4, tmpB], [6, metas[cur]], [7, final]]));
    pass.end();
    const rp = enc.beginRenderPass({ colorAttachments: [{ view: view(target), loadOp: 'load', storeOp: 'store' }] });
    rp.setPipeline(compPipe); rp.setBindGroup(0, bg(compPipe, [[0, ub], [1, depthT], [2, normalT], [3, colorT], [4, final]])); rp.draw(3); rp.end();
    device.queue.submit([enc.finish()]);

    if (captures.has(fi)) {
      const r = await readTarget(); images[`frame${fi}`] = r.url;
      if (fi === frames - 1 || captures.size === 1) {
        // average brightness stats vs baseline
        let sum = 0, n = 0; for (let i = 0; i < r.data.length; i += 4) { sum += r.data[i] + r.data[i+1] + r.data[i+2]; n += 3; }
        stats[`mean_frame${fi}`] = sum / n;
      }
      // debug views from the same GI buffers
      if (fi === frames - 1) {
        for (const [name, dbg] of [['debug_indirect', 1], ['debug_ao', 2], ['debug_radiance', 4], ['debug_lights', 5], ['debug_scale', 6]]) {
          const e2 = device.createCommandEncoder();
          const ubd = ubDebug(dbg);
          const rp2 = e2.beginRenderPass({ colorAttachments: [{ view: view(target), loadOp: 'clear', clearValue: { r: 0, g: 0, b: 0, a: 1 }, storeOp: 'store' }] });
          rp2.setPipeline(compDebugPipe); rp2.setBindGroup(0, bg(compDebugPipe, [[0, ubd], [1, depthT], [2, normalT], [3, colorT], [4, final]])); rp2.draw(3); rp2.end();
          device.queue.submit([e2.finish()]);
          images[name] = (await readTarget()).url;
        }
      }
    }
    prevCam = cam; cur = prev;
  }
  { // baseline stats
    const bpr = W * 4; let sum = 0, n = 0; const d = opts.cache.color; for (let i = 0; i < d.length; i += 4) { sum += d[i]+d[i+1]+d[i+2]; n += 3; }
    stats.mean_baseline = sum / n;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; cv.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(d), W, H), 0, 0);
    images.baseline = cv.toDataURL('image/png');
  }
  await device.queue.onSubmittedWorkDone();
  return { images, log, errors, stats };
};
window.harnessReady = true;
</script>
